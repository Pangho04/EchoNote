appId: dev.pangho.echonote
name: 회의 2건 생성과 SQLite 재실행 유지
---
- launchApp:
    clearState: true

# 첫 생성 뒤 DB를 다시 읽은 결과가 화면에 나타나는지 확인한다.
- assertVisible: '새 회의 녹음'
- tapOn: '새 회의 녹음'
- assertVisible:
    text: '로컬'
    index: 0

# 두 번째 생성도 별도 row로 저장되어 목록에 두 건이 보이는지 확인한다.
- tapOn: '새 회의 녹음'
- assertVisible:
    text: '로컬'
    index: 1

# 앱 프로세스를 다시 시작해도 SQLite의 두 row가 유지되는지 확인한다.
- stopApp
- launchApp
- assertVisible:
    text: '로컬'
    index: 1
