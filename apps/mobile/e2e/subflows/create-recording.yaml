appId: dev.pangho.echonote
name: 회의 하나 만들기
env:
  TITLE: 'E2E 녹음'
---
# 상세·재조회 flow가 쓸 회의를 만든다. 이미 있으면 그대로 둔다.
- runFlow:
    when:
      notVisible: .*${TITLE}.*
    commands:
      - tapOn: '새 회의 녹음'
      - tapOn: '기본 이름으로 저장'
      - inputText: ${TITLE}
      - runFlow:
          when:
            platform: Android
          commands:
            - hideKeyboard
      - tapOn: '녹음 시작'
      - extendedWaitUntil:
          visible: '녹음 종료'
          timeout: 40000
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn: '녹음 종료'
      - extendedWaitUntil:
          visible: .*${TITLE}.*
          timeout: 40000
