appId: dev.pangho.echonote.dev
name: 로그인
---
# 계정은 저장소 밖 파일에서 실행 시 `-e E2E_EMAIL=… -e E2E_PASSWORD=…`로 받는다.
# 앞 단계가 입력해 둔 값이 있을 수 있어 지우고 쓴다.
- tapOn: '이메일'
- eraseText: 80
- inputText: ${E2E_EMAIL}
# iOS는 이메일 입력 뒤 암호 자동 완성 말풍선이 비밀번호 칸을 덮는다. 칸을 누르지 않고
# 키보드 Next로 초점을 옮긴다.
- pressKey: Enter
- eraseText: 80
- inputText: ${E2E_PASSWORD}
# 버튼을 누르지 않고 키보드 Return으로 제출한다. 작은 iPhone에서는 버튼 좌표가 키보드 위
# 암호 자동 완성 막대와 겹친다.
- pressKey: Enter

# 기기의 비밀번호 관리자(삼성 패스 등)가 저장 여부를 묻는 창을 띄우면 목록을 덮는다.
- extendedWaitUntil:
    visible: '메뉴 열기|.*로그인 정보를.*저장할까요.*'
    timeout: 30000
- runFlow:
    when:
      visible: '.*로그인 정보를.*저장할까요.*'
    commands:
      - tapOn: '취소'
