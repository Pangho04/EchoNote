appId: dev.pangho.echonote.dev
name: 녹음 취소 확인과 폐기
---
# 마이크 권한은 미리 허용된 상태를 전제한다. README의 권한 준비를 먼저 실행한다.
- runFlow: ../subflows/start-at-list.yaml
# 제목은 실행마다 달라야 앞선 실행이 남긴 같은 제목의 회의가 결과를 바꾸지 않는다.
- evalScript: ${output.title = 'E2E 폐기 녹음 ' + (Date.now() % 100000)}

- tapOn: '메뉴 열기'

- tapOn: '녹음하기'
- tapOn: '기본 이름으로 저장'
- inputText: ${output.title}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard

- tapOn: '녹음 시작'

- extendedWaitUntil:
    visible: '녹음 종료'
    timeout: 40000

# 확인 팝업에서 계속 녹음을 고르면 녹음 화면에 그대로 남는다.
- tapOn: '취소'
- extendedWaitUntil:
    visible: '녹음을 버릴까요?'
    timeout: 10000
- tapOn: '계속 녹음'
- assertVisible: '녹음 종료'

- tapOn: '취소'
- extendedWaitUntil:
    visible: '녹음을 버릴까요?'
    timeout: 10000
- tapOn: '녹음 버리기'

- extendedWaitUntil:
    visible: '메뉴 열기'
    timeout: 10000

# maestro-runner의 notVisible은 오판한 전례가 있어 공식 Maestro를 쓰는 Android에서만 확인한다.
- runFlow:
    when:
      platform: Android
    commands:
      - assertNotVisible: .*${output.title}.*
