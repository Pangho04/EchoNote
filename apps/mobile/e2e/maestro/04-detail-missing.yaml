appId: dev.pangho.echonote
name: 없는 회의를 열면 오류 팝업
---
- runFlow: ../subflows/start-at-list.yaml

# 존재하지 않는 meetingId로 진입한다. 뒤로 갈 화면이 없는 경로다.
- openLink: echonote://meetings/no-such-meeting-id

- runFlow: ../subflows/dismiss-link-prompt.yaml

- extendedWaitUntil:
    visible: '회의를 열 수 없습니다'
    timeout: 30000
- assertVisible: '회의를 찾을 수 없습니다.'

# native Alert이 아니라 DialogView가 그린 팝업이어야 한다.
- tapOn: '확인'

- assertNotVisible: '회의를 열 수 없습니다'
- assertVisible: '회의'
