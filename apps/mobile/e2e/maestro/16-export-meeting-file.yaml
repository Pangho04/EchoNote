appId: dev.pangho.echonote.dev
name: 회의 파일을 기기에 저장하기
---
# 저장 파일 이름이 회의 제목에서 오므로 실행마다 제목을 달리해 이름 충돌을 피한다.
- runFlow: ../subflows/start-at-list.yaml
- evalScript: ${output.title = 'E2E 저장 ' + (Date.now() % 100000)}
- runFlow:
    file: ../subflows/create-recording.yaml
    env:
      TITLE: ${output.title}

- tapOn: .*${output.title}.*
- extendedWaitUntil:
    visible: '회의 파일 저장'
    timeout: 10000

- tapOn: '회의 파일 저장'
- assertVisible: '내보낼 파일 종류, 현재 .*'
- tapOn: '저장'
- runFlow:
    when:
      platform: Android
    commands:
      # 앱 시트가 닫힌 뒤 시스템 저장 화면이 뜨기까지 틈이 있어, 저장 화면이 보일 때까지 기다린다.
      - extendedWaitUntil:
          visible:
            id: 'com.google.android.documentsui:id/container_save'
          timeout: 10000
      # 저장 화면은 파일 이름 입력줄에 키보드를 띄우기도 해서, 뒤로 한 번은 키보드만 내릴 수 있다.
      # 앱 화면이 돌아올 때까지 뒤로를 누른다.
      - repeat:
          while:
            notVisible: '회의 파일 저장'
          times: 3
          commands:
            - back
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: 'DOCPicker.actionButton'
          timeout: 10000
      - runFlow:
          when:
            visible: '둘러보기'
          commands:
            - tapOn: '둘러보기'
      - tapOn: 'Cancel'
- extendedWaitUntil:
    visible: '회의 파일 저장'
    timeout: 10000
- assertNotVisible: '저장했습니다'
- assertNotVisible: '내보내지 못했습니다'

- tapOn: '회의 파일 저장'
- tapOn: '저장'
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: 'com.google.android.documentsui:id/container_save'
          timeout: 10000
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn: '저장'
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: 'DOCPicker.actionButton'
          timeout: 10000
      - tapOn:
          id: 'DOCPicker.actionButton'
- extendedWaitUntil:
    visible: '저장했습니다'
    timeout: 30000
- tapOn: '확인'

# 목록으로 돌아가 이 flow가 만든 회의를 지운다.
- tapOn: '회의 목록으로 이동'
- extendedWaitUntil:
    visible: '메뉴 열기'
    timeout: 10000
- runFlow:
    file: ../subflows/delete-meeting.yaml
    env:
      TITLE: ${output.title}
