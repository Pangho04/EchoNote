appId: dev.pangho.echonote.dev
name: 회의 녹음을 기기에 저장하기
---
# 저장 파일 이름이 회의 제목에서 오므로 실행마다 제목을 달리해 이름 충돌을 피한다.
- runFlow: ../subflows/start-at-list.yaml
- evalScript: ${output.title = 'E2E 저장 ' + (Date.now() % 100000)}
- runFlow:
    file: ../subflows/create-recording.yaml
    env:
      TITLE: ${output.title}

- tapOn: .*${output.title}.*
- extendedWaitUntil:
    visible: '회의 파일 저장'
    timeout: 10000

- tapOn: '회의 파일 저장'
- assertVisible: '내보낼 파일 종류, 현재 녹음 파일 \(.m4a\)'
- tapOn: '저장'
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          notVisible: '회의 파일 저장'
          timeout: 10000
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: 'DOCPicker.actionButton'
          timeout: 10000
      - runFlow:
          when:
            visible: '둘러보기'
          commands:
            - tapOn: '둘러보기'
      - tapOn: 'Cancel'
- extendedWaitUntil:
    visible: '회의 파일 저장'
    timeout: 10000
- assertNotVisible: '저장했습니다'

- tapOn: '회의 파일 저장'
- tapOn: '저장'
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          notVisible: '회의 파일 저장'
          timeout: 10000
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn: '저장'
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: 'DOCPicker.actionButton'
          timeout: 10000
      - tapOn:
          id: 'DOCPicker.actionButton'
- extendedWaitUntil:
    visible: '저장했습니다'
    timeout: 30000
- tapOn: '확인'
