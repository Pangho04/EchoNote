appId: dev.pangho.echonote
name: 목록에서 상세로 이동
env:
  TITLE: 'E2E 녹음'
---
# 02가 만든 회의를 사용한다. 단독 실행하려면 먼저 02를 돌린다.
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: ${TITLE}
    timeout: 10000

- tapOn: ${TITLE}

- assertVisible: '회의 기록'
- assertVisible: ${TITLE}
# 상세는 길이를 초까지 표시한다.
- assertVisible:
    text: '.*녹음만 저장됨.*'

- tapOn: '회의 목록으로 이동'
- assertVisible: '회의'
- assertNotVisible: '회의 기록'
