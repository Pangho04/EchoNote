appId: dev.pangho.echonote
name: 목록에서 상세로 이동
env:
  TITLE: 'E2E 녹음'
---
- runFlow: ../subflows/start-at-list.yaml

# flow 실행 순서는 보장되지 않는다. 필요한 회의를 이 flow가 직접 준비한다.
- runFlow: ../subflows/create-recording.yaml

- tapOn: .*${TITLE}.*

- assertVisible: '회의 기록'
- assertVisible: .*${TITLE}.*
# 상세는 길이와 상태를 함께 보여준다.
- assertVisible: '.*녹음만 저장됨.*'

- tapOn: '회의 목록으로 이동'
- assertVisible: '회의'
- assertNotVisible: '회의 기록'
