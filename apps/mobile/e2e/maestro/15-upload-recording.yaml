appId: dev.pangho.echonote
name: m4a 파일을 업로드해 회의 만들기
---
# 기기에 `e2e-upload.m4a`를 미리 넣어 둔다(README 「업로드 파일 준비」).
# 시스템 파일 선택 창은 앱 밖 화면이라 문구가 기기 언어를 따른다. 선택자는 한국어 기준이다.
- runFlow: ../subflows/start-at-list.yaml
- tapOn: '메뉴 열기'
- tapOn: '업로드'
- runFlow:
    when:
      platform: Android
    commands:
      # 최근 파일이 비어 있을 수 있어 다운로드 폴더로 들어간다.
      - extendedWaitUntil:
          visible: '루트 표시'
          timeout: 10000
      - tapOn: '루트 표시'
      # 서랍이 열리는 동안 누르면 항목 위치가 어긋나 서랍만 닫힌다.
      - extendedWaitUntil:
          visible: '다음에서 열기:'
          timeout: 10000
      - waitForAnimationToEnd:
          timeout: 3000
      # 상단 경로 표시에도 숨은 「다운로드」가 있어 서랍 항목 id로 좁힌다.
      - tapOn:
          text: '다운로드'
          id: 'android:id/title'
      - extendedWaitUntil:
          visible: 'e2e-upload.m4a'
          timeout: 10000
      - tapOn: 'e2e-upload.m4a'
- runFlow:
    when:
      platform: iOS
    commands:
      # 파일 앱은 확장자를 숨길 수 있어 이름 앞부분으로 고른다.
      - tapOn: '둘러보기'
      - tapOn: '나의 iPhone'
      - tapOn: 'e2e-upload.*'

# 고르면 바로 상세로 바뀌고, 가져오기가 끝나면 녹음 길이가 보인다.
- extendedWaitUntil:
    visible: '회의 기록'
    timeout: 30000
- extendedWaitUntil:
    visible: '.*[0-9]+초 · .*'
    timeout: 30000
- assertVisible: '.*_녹음.*'
