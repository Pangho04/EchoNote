appId: dev.pangho.echonote.dev
name: 연도를 바꿔 회의 목록 조회
---
# 트리거도 `2026년`처럼 연도만 보여 주므로 항목은 트리거가 보여 주지 않는 연도로 고른다.
- runFlow: ../subflows/start-at-list.yaml
# 제목은 실행마다 달라야 앞선 실행이 남긴 같은 제목의 회의가 결과를 바꾸지 않는다.
- evalScript: ${output.title = 'E2E 연도 필터 ' + (Date.now() % 100000)}
- runFlow:
    file: ../subflows/create-recording.yaml
    env:
      TITLE: ${output.title}

# 작년을 고르면 올해 만든 회의가 목록에서 빠진다.
- tapOn: '조회 연도 변경.*'
- tapOn: '^${new Date().getFullYear() - 1}년$'
- extendedWaitUntil:
    visible: '저장된 회의가 없습니다.'
    timeout: 10000
- assertNotVisible: .*${output.title}.*

# 올해로 돌아오면 다시 보인다.
- tapOn: '조회 연도 변경.*'
- tapOn: '^${new Date().getFullYear()}년$'
- extendedWaitUntil:
    visible: .*${output.title}.*
    timeout: 10000

- runFlow:
    file: ../subflows/delete-meeting.yaml
    env:
      TITLE: ${output.title}
