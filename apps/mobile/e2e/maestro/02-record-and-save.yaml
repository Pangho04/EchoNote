appId: dev.pangho.echonote
name: 녹음 저장과 목록 반영
env:
  TITLE: 'E2E 녹음'
---
# 마이크 권한은 미리 허용된 상태를 전제한다. README의 권한 준비를 먼저 실행한다.
- runFlow: ../subflows/start-at-list.yaml

- tapOn: '새 회의 녹음'
- tapOn: '기본 이름으로 저장'
- inputText: ${TITLE}
# iOS 시뮬레이터는 하드웨어 키보드를 쓰므로 내릴 소프트 키보드가 없다.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard

- tapOn: '녹음 시작'

# 녹음 화면은 진입과 동시에 녹음을 시작한다. 실제 기기 상태가 확인되면 종료 버튼이 살아난다.
- extendedWaitUntil:
    visible: '녹음 종료'
    timeout: 40000

# 길이가 0인 파일이 저장되지 않도록 잠시 녹음한다.
- waitForAnimationToEnd:
    timeout: 3000

- tapOn: '일시정지'
- tapOn: '재개'
# Android는 목록으로 돌아온 뒤 화면 안정을 기다리면 그사이 저장 토스트가 사라진다.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: '녹음 종료'
          waitToSettleTimeoutMs: 500
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: '녹음 종료'

# 저장 성공 토스트는 2.4초 뒤 사라지므로 즉시 확인한다.
- extendedWaitUntil:
    visible: '녹음을 저장했습니다.'
    timeout: 40000

# 저장이 끝나면 목록으로 돌아오고 방금 만든 회의가 보인다.
- extendedWaitUntil:
    visible: .*${TITLE}.*
    timeout: 10000
