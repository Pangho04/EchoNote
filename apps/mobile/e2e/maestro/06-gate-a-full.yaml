appId: dev.pangho.echonote
name: Gate A 녹음·재시작·재생 전체 흐름
env:
  TITLE: 'Gate A 녹음'
---
# 마이크 권한은 미리 허용된 상태를 전제한다. README의 권한 준비를 먼저 실행한다.
- runFlow: ../subflows/start-at-list.yaml

- tapOn: '메뉴 열기'

- tapOn: '녹음하기'
- tapOn: '기본 이름으로 저장'
- inputText: ${TITLE}
# iPhone 실기기는 앞쪽 글자를 가끔 빠뜨린다(`create-recording.yaml`과 같은 이유). 한 번 다시 쓴다.
- runFlow:
    when:
      notVisible: .*${TITLE}.*
    commands:
      - eraseText: 80
      - inputText: ${TITLE}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard

- tapOn: '녹음 시작'

- extendedWaitUntil:
    visible: '녹음 종료'
    timeout: 40000

- tapOn: '일시정지'
- tapOn: '재개'

# 경과 표시가 30초대에 들어설 때까지 녹음을 이어 간다. 1분 미만은 `N초`로 표시한다.
- extendedWaitUntil:
    visible: '.*3[0-9]초.*'
    timeout: 60000

# Android는 목록으로 돌아온 뒤 화면 안정을 기다리면 그사이 저장 토스트가 사라진다.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: '녹음 종료'
          waitToSettleTimeoutMs: 500
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: '녹음 종료'

- extendedWaitUntil:
    visible: '녹음을 저장했습니다.'
    timeout: 40000

- extendedWaitUntil:
    visible: .*${TITLE}.*
    timeout: 10000

# 메모리 상태만 버리고 SQLite와 녹음 파일로 다시 읽는다.
- stopApp
- launchApp:
    clearState: false

- runFlow: ../subflows/dismiss-link-prompt.yaml

- extendedWaitUntil:
    visible: .*${TITLE}.*
    timeout: 30000

- tapOn: .*${TITLE}.*

- extendedWaitUntil:
    visible: '회의 기록'
    timeout: 10000

# 길이 표시는 SQLite에서 다시 읽은 값이다. 변환 상태는 Worker에 따라 달라 보지 않는다.
- assertVisible: '.*3[0-9]초 · .*'

# 재생 위치는 `m:ss / m:ss`로 표시한다. 멈춘 상태의 seek는 정확한 값으로 확인한다.
- tapOn: '10초 앞으로'
- extendedWaitUntil:
    visible: '.*0:10 / 0:3[0-9].*'
    timeout: 10000

- tapOn: '10초 뒤로'
- extendedWaitUntil:
    visible: '.*0:00 / 0:3[0-9].*'
    timeout: 10000

# 재생 중에는 위치 표시가 계속 바뀌어 탭이 화면 안정을 기다리느라 수 초씩 늦어진다.
# 대기를 500ms로 줄이고, 두 번 읽은 위치 차이에서 그사이 흐른 시간을 빼서 seek 폭을 확인한다.
# 판정 오차 ±4초는 초 단위 내림과, iPhone에서 한 번에 2초 넘게 걸리는 copyTextFrom의 읽기 시점 오차를
# 흡수한다. seek가 안 됐다면 오차가 10초 근처라 구분된다.
- evalScript: ${output.toSec = function (label) { var p = label.split(' / ')[0].split(':'); return Number(p[0]) * 60 + Number(p[1]); }}
# seek 직후 위치 뒤 1~5초 중 하나가 보이면 재생이 이어진 것이다. 갱신이 한 번 늦어 1초를
# 건너뛰어도 통과하도록 범위로 기다린다.
- evalScript: ${output.laterThan = function (sec) { return [1, 2, 3, 4, 5].map(function (n) { var s = sec + n; return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }).join('|'); }}

- tapOn:
    text: '재생'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: '정지'
    timeout: 10000
- extendedWaitUntil:
    visible: '.*0:0[2-9] / .*'
    timeout: 10000

- copyTextFrom:
    text: '\d+:\d{2} / \d+:\d{2}'
- evalScript: ${output.a = output.toSec(maestro.copiedText); output.t1 = Date.now()}
- tapOn:
    text: '10초 앞으로'
    waitToSettleTimeoutMs: 500
- copyTextFrom:
    text: '\d+:\d{2} / \d+:\d{2}'
- evalScript: ${output.b = output.toSec(maestro.copiedText); output.t2 = Date.now()}
- assertTrue: ${Math.abs(output.b - (output.a + 10 + (output.t2 - output.t1) / 1000)) <= 4}

- evalScript: ${output.later = output.laterThan(output.b)}
- extendedWaitUntil:
    visible: '(${output.later}) / .*'
    timeout: 6000
- assertVisible: '정지'

- copyTextFrom:
    text: '\d+:\d{2} / \d+:\d{2}'
- evalScript: ${output.c = output.toSec(maestro.copiedText); output.t1 = Date.now()}
- tapOn:
    text: '10초 뒤로'
    waitToSettleTimeoutMs: 500
- copyTextFrom:
    text: '\d+:\d{2} / \d+:\d{2}'
- evalScript: ${output.d = output.toSec(maestro.copiedText); output.t2 = Date.now()}
- assertTrue: ${Math.abs(output.d - (output.c - 10 + (output.t2 - output.t1) / 1000)) <= 4}

- evalScript: ${output.later = output.laterThan(output.d)}
- extendedWaitUntil:
    visible: '(${output.later}) / .*'
    timeout: 6000
- assertVisible: '정지'

# 정지하면 위치가 더 움직이지 않는다. 기다릴 화면 변화가 없으므로 스크립트 안에서 2초를 보낸다.
- tapOn:
    text: '정지'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: '재생'
    timeout: 10000
- copyTextFrom:
    text: '\d+:\d{2} / \d+:\d{2}'
- evalScript: ${output.e = maestro.copiedText; var s = Date.now(); while (Date.now() - s < 2000) {}}
- copyTextFrom:
    text: '\d+:\d{2} / \d+:\d{2}'
- assertTrue: ${maestro.copiedText == output.e}

# 목록으로 돌아가 이 flow가 만든 회의를 밀어서 지운다. 실행마다 같은 제목의 행이 쌓이지 않게 한다.
- tapOn: '회의 목록으로 이동'
- extendedWaitUntil:
    visible: '메뉴 열기'
    timeout: 10000

- swipe:
    from: .*${TITLE}.*
    direction: LEFT
# 닫힌 행 뒤의 숨은 삭제 버튼도 `삭제`로 잡히므로 열린 행의 버튼을 id로 누른다.
- tapOn:
    id: 'meeting-row-delete'
- extendedWaitUntil:
    visible: '삭제하시겠습니까? 복구가 불가능합니다.'
    timeout: 10000
- tapOn: '확인'
- extendedWaitUntil:
    visible: '메뉴 열기'
    timeout: 10000

# maestro-runner의 notVisible은 오판한 전례가 있어 공식 Maestro를 쓰는 Android에서만 확인한다.
- runFlow:
    when:
      platform: Android
    commands:
      - assertNotVisible: .*${TITLE}.*
