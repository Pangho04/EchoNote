appId: dev.pangho.echonote
name: Gate A 녹음·재시작·재생 전체 흐름
env:
  TITLE: 'Gate A 녹음'
---
# 마이크 권한은 미리 허용된 상태를 전제한다. README의 권한 준비를 먼저 실행한다.
- runFlow: ../subflows/start-at-list.yaml

- tapOn: '새 회의 녹음'
- tapOn: '기본 이름으로 저장'
- inputText: ${TITLE}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard

- tapOn: '녹음 시작'

- extendedWaitUntil:
    visible: '녹음 종료'
    timeout: 40000

- tapOn: '일시정지'
- tapOn: '재개'

# 경과 표시가 30초대에 들어설 때까지 녹음을 이어 간다. 1분 미만은 `N초`로 표시한다.
- extendedWaitUntil:
    visible: '.*3[0-9]초.*'
    timeout: 60000

- tapOn: '녹음 종료'

- extendedWaitUntil:
    visible: '녹음을 저장했습니다.'
    timeout: 40000

- extendedWaitUntil:
    visible: .*${TITLE}.*
    timeout: 10000

# 메모리 상태만 버리고 SQLite와 녹음 파일로 다시 읽는다.
- stopApp
- launchApp:
    clearState: false

- runFlow: ../subflows/dismiss-link-prompt.yaml

- extendedWaitUntil:
    visible: .*${TITLE}.*
    timeout: 30000

- tapOn: .*${TITLE}.*

- extendedWaitUntil:
    visible: '회의 기록'
    timeout: 10000

- assertVisible: '.*녹음만 저장됨.*'

# 재생 위치는 `m:ss / m:ss`로 표시한다. 멈춘 상태의 seek는 정확한 값으로 확인한다.
- tapOn: '10초 앞으로'
- extendedWaitUntil:
    visible: '.*0:10 / 0:3[0-9].*'
    timeout: 10000

- tapOn: '10초 뒤로'
- extendedWaitUntil:
    visible: '.*0:00 / 0:3[0-9].*'
    timeout: 10000

# 재생 중에는 위치 표시가 계속 바뀌어 탭이 화면 안정을 기다리느라 수 초씩 늦어진다.
# 대기를 500ms로 줄이고, 두 번 읽은 위치 차이에서 그사이 흐른 시간을 빼서 seek 폭을 확인한다.
# 판정 오차 ±2초는 표시가 초 단위로 내림되는 것과 읽기 지연을 흡수한다.
- evalScript: ${output.toSec = function (label) { var p = label.split(' / ')[0].split(':'); return Number(p[0]) * 60 + Number(p[1]); }}
# seek 직후 위치 뒤 1~5초 중 하나가 보이면 재생이 이어진 것이다. 갱신이 한 번 늦어 1초를
# 건너뛰어도 통과하도록 범위로 기다린다.
- evalScript: ${output.laterThan = function (sec) { return [1, 2, 3, 4, 5].map(function (n) { var s = sec + n; return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }).join('|'); }}

- tapOn:
    text: '재생'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: '정지'
    timeout: 10000
- extendedWaitUntil:
    visible: '.*0:0[2-9] / .*'
    timeout: 10000

- copyTextFrom:
    text: '\d+:\d{2} / \d+:\d{2}'
- evalScript: ${output.a = output.toSec(maestro.copiedText); output.t1 = Date.now()}
- tapOn:
    text: '10초 앞으로'
    waitToSettleTimeoutMs: 500
- copyTextFrom:
    text: '\d+:\d{2} / \d+:\d{2}'
- evalScript: ${output.b = output.toSec(maestro.copiedText); output.t2 = Date.now()}
- assertTrue: ${Math.abs(output.b - (output.a + 10 + (output.t2 - output.t1) / 1000)) <= 2}

- evalScript: ${output.later = output.laterThan(output.b)}
- extendedWaitUntil:
    visible: '(${output.later}) / .*'
    timeout: 6000
- assertVisible: '정지'

- copyTextFrom:
    text: '\d+:\d{2} / \d+:\d{2}'
- evalScript: ${output.c = output.toSec(maestro.copiedText); output.t1 = Date.now()}
- tapOn:
    text: '10초 뒤로'
    waitToSettleTimeoutMs: 500
- copyTextFrom:
    text: '\d+:\d{2} / \d+:\d{2}'
- evalScript: ${output.d = output.toSec(maestro.copiedText); output.t2 = Date.now()}
- assertTrue: ${Math.abs(output.d - (output.c - 10 + (output.t2 - output.t1) / 1000)) <= 2}

- evalScript: ${output.later = output.laterThan(output.d)}
- extendedWaitUntil:
    visible: '(${output.later}) / .*'
    timeout: 6000
- assertVisible: '정지'

# 정지하면 위치가 더 움직이지 않는다. 기다릴 화면 변화가 없으므로 스크립트 안에서 2초를 보낸다.
- tapOn:
    text: '정지'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: '재생'
    timeout: 10000
- copyTextFrom:
    text: '\d+:\d{2} / \d+:\d{2}'
- evalScript: ${output.e = maestro.copiedText; var s = Date.now(); while (Date.now() - s < 2000) {}}
- copyTextFrom:
    text: '\d+:\d{2} / \d+:\d{2}'
- assertTrue: ${maestro.copiedText == output.e}
