appId: dev.pangho.echonote.dev
env:
  DEV_CLIENT_URL: 'exp+echonote://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081'
name: 권한 거부면 팝업을 유지하고 재시도를 허용한다
---
# 선행: e2e/device-state.sh <platform> permission-deny
# launchApp은 Maestro가 권한을 자동 허용하므로 쓸 수 없다.
# dev 빌드는 콜드 스타트가 dev launcher로 가므로 개발 서버 URL로 직접 띄운다.
# 다른 개발 PC에서는 -e DEV_CLIENT_URL=... 로 덮어쓴다.
- stopApp
- openLink: ${DEV_CLIENT_URL}
- runFlow: ../subflows/dismiss-link-prompt.yaml
- extendedWaitUntil:
    visible: '회의'
    timeout: 30000

- tapOn: '메뉴 열기'

- tapOn: '녹음하기'
- tapOn: '녹음 시작'

# OS 권한 창이 뜬다. 버튼 문구는 플랫폼·버전마다 달라 여러 표기를 함께 받는다.
- extendedWaitUntil:
    visible: '허용 안 함|허용 안함|Don.t Allow|거부|Deny'
    timeout: 20000
- tapOn: '허용 안 함|허용 안함|Don.t Allow|거부|Deny'

- extendedWaitUntil:
    visible: '마이크 권한을 허용해야 녹음을 시작할 수 있습니다.'
    timeout: 20000
# 단순 거부는 다시 시도할 수 있어야 한다.
- assertVisible: '녹음 시작'
- assertNotVisible: '설정 열기'

- tapOn: '취소'
- assertVisible: '회의'
