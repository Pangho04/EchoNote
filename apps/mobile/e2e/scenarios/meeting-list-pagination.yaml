appId: dev.pangho.echonote
name: 목록 끝에 닿으면 다음 page를 이어 불러온다
---
# 선행: e2e/device-state.sh <platform> meetings-seed <device>
# 후행: e2e/device-state.sh <platform> meetings-unseed <device>
# 첫 page는 20건이므로 seed 25건 중 가장 오래된 25번은 다음 page를 불러와야 보인다.
- runFlow: ../subflows/start-at-list.yaml
- scrollUntilVisible:
    element:
      text: '.*E2E 페이지 25.*'
    direction: DOWN
    timeout: 60000
