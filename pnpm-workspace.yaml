packages:
  - apps/*
  - packages/*
  - services/*

engineStrict: true
nodeLinker: isolated
saveExact: true
strictPeerDependencies: true

allowBuilds:
  '@parcel/watcher': true
  electron: true
  electron-winstaller: false
  esbuild: true

catalog:
  '@types/node': 24.13.3
  typescript: 6.0.3
  vitest: 4.1.10

minimumReleaseAgeExclude:
  - fastify@5.11.2
  - tsx@4.23.5
  - '@expo/cli@57.0.14'
  - '@expo/fingerprint@0.20.7'
  - '@expo/inline-modules@0.1.5'
  - '@expo/local-build-cache-provider@57.0.6'
  - '@expo/metro-config@57.0.8'
  - '@expo/prebuild-config@57.0.11'
  - expo-asset@57.0.10
  - expo-constants@57.0.10
  - expo-server@57.0.2
  - expo@57.0.12
  - '@expo/metro-runtime@57.0.9'
  - '@expo/ui@57.0.10'
  - expo-dev-client@57.0.11
  - expo-dev-launcher@57.0.11
  - expo-dev-menu@57.0.11
  - expo-router@57.0.12
  - jest-expo@57.0.4

overrides:
  'xcode>uuid': 11.1.1
