packages:
  - apps/*
  - packages/*
  - services/*

engineStrict: true
nodeLinker: isolated
saveExact: true
strictPeerDependencies: true

allowBuilds:
  '@parcel/watcher': true
  electron: true
  electron-winstaller: false
  esbuild: true

catalog:
  '@types/node': 24.13.3
  # Vercel fastify 빌더는 symlink 실경로를 따라가지 않아 @types/node 옆 undici-types를 못 찾는다. @types/node가 요구하는 범위와 맞춘다.
  undici-types: ~7.18.0
  typescript: 6.0.3
  vitest: 4.1.10

minimumReleaseAgeExclude:
  - fastify@5.11.2
  - tsx@4.23.5
  - '@expo/cli@57.0.14 || 57.0.23'
  - '@expo/fingerprint@0.20.7'
  - '@expo/inline-modules@0.1.5'
  - '@expo/local-build-cache-provider@57.0.6'
  - '@expo/metro-config@57.0.8'
  - '@expo/prebuild-config@57.0.11'
  - expo-asset@57.0.10
  - expo-constants@57.0.10
  - expo-server@57.0.2
  - expo@57.0.12 || 57.0.21
  - '@expo/metro-runtime@57.0.9'
  - '@expo/ui@57.0.10 || 57.0.17'
  - expo-dev-client@57.0.11
  - expo-dev-launcher@57.0.11
  - expo-dev-menu@57.0.11
  - expo-router@57.0.12 || 57.0.20
  - jest-expo@57.0.4
  - '@expo/metro-file-map@57.0.3'
  - babel-preset-expo@57.0.11
  - expo-modules-core@57.0.17
  - expo-modules-jsi@57.1.0
  - expo-glass-effect@57.0.2
  - expo-build-properties@57.0.20

overrides:
  'xcode>uuid': 11.1.1
